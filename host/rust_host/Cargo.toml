[package]
name = "browser_agent_host"
version = "2.150.113"
edition = "2021"
authors = ["Arya <arstate>"]
description = "Browser Agent - High Performance Rust Native Messaging Host & SQLite Persistent Brain"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
flate2 = "1.0"
tar = "0.4"
base64 = "0.22"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
